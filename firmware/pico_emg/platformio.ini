; EMG gripper firmware - Raspberry Pi Pico (RP2040)
;
; PlatformIO, not the Arduino IDE, per the project convention that board
; definitions live in platformio.ini.
;
; Uses the earlephilhower arduino-pico core rather than the Arduino mbed
; core: it exposes the Pico SDK directly (hardware/adc.h, pico/time.h),
; which is what the 1 kHz hardware-timer sampling needs. The mbed core
; hides those behind its own RTOS abstractions.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags =
    -Iinclude
    -Wall
    -Wextra
    -O2
monitor_speed = 921600

; Same firmware, plus a once-a-second human-readable status line on USB.
; Useful during bring-up stage 4 before any host tooling exists.
[env:pico_debug]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DEMG_DEBUG_REPORT=1
